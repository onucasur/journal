<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive Viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/awesomplete@1.1.7/awesomplete.css">
<style>
  :root{
    --bg:        #0c0d0f;
    --panel:     #16181b;
    --panel-2:   #1c1f23;
    --line:      #2a2d32;
    --text:      #e9e6df;
    --text-dim:  #8d9096;
    --accent:    #c99a4b;
    --accent-dim:#5e4a26;
    --danger:    #c96b4b;
    --news:      #5b8cc9;
    --video:     #c95b8c;
    --serif: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    /* Translucent control colors. JS scales the alpha of these by the user's opacity setting.
       Full rgba() values are stored (instead of just alphas) for maximum Safari compatibility. */
    --btn-bg: rgba(255,255,255,0.25);
    --btn-border: rgba(255,255,255,0.50);
    --btn-hover-bg: rgba(255,255,255,0.35);
    --add-pill-bg: rgba(30,30,35,0.85);
    --add-pill-border: rgba(255,255,255,0.40);
    --dark-control-bg: rgba(0,0,0,1.00);
    --top-bar-gradient-start: rgba(0,0,0,1.00);
    --bottom-bar-gradient-start: rgba(0,0,0,1.00);
    --nav-zone-hover: rgba(255,255,255,0.10);
    --header-bg: rgba(12,13,15,1.00);
    --badge-bg: rgba(0,0,0,1.00);
    --checkbox-bg: rgba(0,0,0,0.80);
    --checkbox-border: rgba(255,255,255,1.00);
    --tag-pill-bg: rgba(201,154,75,0.70);
    --tag-pill-border: rgba(201,154,75,1.00);
    --link-pill-news-bg: rgba(91,140,201,0.70);
    --link-pill-news-border: rgba(91,140,201,1.00);
    --link-pill-video-bg: rgba(201,91,140,0.70);
    --link-pill-video-border: rgba(201,91,140,1.00);
    --fullscreen-tag-bg: rgba(201,154,75,1.00);
    --fullscreen-news-bg: rgba(91,140,201,1.00);
    --fullscreen-video-bg: rgba(201,91,140,1.00);
    --remove-hover-bg: rgba(201,107,75,0.50);
    --add-hover-bg: rgba(201,154,75,0.50);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);}
  ::selection{background:var(--accent-dim);color:var(--text);}

  #loadError{
    display:none;max-width:480px;margin:80px auto;padding:24px;background:var(--panel);
    border:1px solid var(--danger);border-radius:5px;text-align:center;color:var(--text-dim);
  }
  #loadError .big{font-family:var(--serif);font-size:1.2rem;color:var(--text);margin-bottom:10px;}
  #loadError code{background:var(--panel-2);padding:2px 6px;border-radius:3px;color:var(--accent);}

  #archive{display:none;min-height:100vh;flex-direction:column;}
  header{
    position:sticky;top:0;z-index:5;background:var(--header-bg);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:18px 26px;display:flex;flex-direction:column;gap:14px;
  }
  .header-top{display:flex;align-items:center;flex-wrap:wrap;gap:14px;}
  .header-top h1{font-family:var(--serif);font-weight:400;font-size:1.5rem;margin:0;color:var(--text);flex-shrink:0;}
  .header-top .right{display:flex;align-items:center;gap:14px;flex-shrink:0;}
  .header-top .count{font-family:var(--mono);font-size:0.78rem;color:var(--text-dim);white-space:nowrap;}
  .search-inline{display:flex;gap:10px;align-items:center;flex:1;min-width:220px;}
  .rescan-btn{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);
    padding:6px 12px;border-radius:20px;font-family:var(--mono);font-size:0.72rem;cursor:pointer;
    display:flex;align-items:center;gap:6px;transition:border-color .15s,color .15s;
  }
  .rescan-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  .rescan-btn:disabled{opacity:0.5;cursor:default;}
  .rescan-btn.active-view{background:var(--accent-dim);color:var(--accent);border-color:var(--accent);}
  .rescan-btn svg{width:12px;height:12px;}
  .rescan-btn.spinning svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  #tagInput{
    flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:9px 12px;border-radius:3px;font-size:0.9rem;font-family:var(--sans);
  }
  #tagInput:focus{outline:none;border-color:var(--accent);}
  .mode-toggle{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;font-family:var(--mono);font-size:0.75rem;flex-shrink:0;}
  .mode-toggle button{background:var(--panel);color:var(--text-dim);border:none;padding:9px 14px;cursor:pointer;}
  .mode-toggle button.active{background:var(--accent-dim);color:var(--accent);}

  .chips{display:flex;flex-wrap:wrap;gap:7px;min-height:0;}
  .chip{
    display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:20px;padding:5px 10px 5px 12px;font-family:var(--mono);font-size:0.75rem;color:var(--text);
  }
  .chip button{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:0.9rem;line-height:1;padding:0;}
  .chip button:hover{color:var(--danger);}

  .tag-suggestions{display:flex;flex-wrap:wrap;gap:6px;}
  .tag-suggestion{
    display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:20px;
    overflow:hidden;transition:border-color .15s;
  }
  .tag-suggestion:hover{border-color:var(--accent);}
  .tag-suggestion .tag-add{
    background:transparent;border:none;color:var(--text-dim);
    padding:4px 6px 4px 12px;font-family:var(--mono);font-size:0.72rem;cursor:pointer;
    transition:color .15s;
  }
  .tag-suggestion .tag-add:hover{color:var(--accent);}
  .tag-suggestion .tag-delete{
    background:transparent;border:none;border-left:1px solid var(--line);color:var(--text-dim);
    padding:4px 10px;font-size:0.85rem;line-height:1;cursor:pointer;transition:color .15s;
  }
  .tag-suggestion .tag-delete:hover{color:var(--danger);}

  main{flex:1;padding:26px;display:flex;gap:20px;align-items:flex-start;}
  #results{flex:1;min-width:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;}
  .notes-panel{
    width:560px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;
    background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:14px;
    max-height:calc(100vh - 180px);position:sticky;top:20px;
  }
  .notes-header{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .notes-header h3{margin:0;font-family:var(--sans);font-size:0.95rem;color:var(--text);}
  .notes-tabs{display:flex;gap:4px;}
  .notes-tabs button{
    background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--text-dim);
    padding:3px 10px;font-family:var(--sans);font-size:0.75rem;cursor:pointer;transition:all .15s;
  }
  .notes-tabs button.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
  .notes-tabs button:hover:not(.active){border-color:var(--text-dim);color:var(--text);}
  .notes-toolbar{display:flex;flex-wrap:wrap;gap:4px;}
  .notes-toolbar button{
    background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--text-dim);
    padding:4px 8px;font-family:var(--sans);font-size:0.8rem;line-height:1;cursor:pointer;transition:all .15s;
  }
  .notes-toolbar button:hover{border-color:var(--text-dim);color:var(--text);}
  .notes-toolbar .toolbar-sep{width:1px;background:var(--line);margin:0 4px;}
  .notes-panel textarea{
    flex:1;min-height:300px;background:transparent;border:1px solid var(--line);border-radius:4px;
    color:var(--text);padding:10px;font-family:var(--mono);font-size:0.85rem;resize:vertical;
  }
  .notes-panel textarea:focus{outline:none;border-color:var(--accent);}
  .notes-preview{
    flex:1;min-height:300px;overflow:auto;background:rgba(0,0,0,0.2);border:1px solid var(--line);border-radius:4px;
    padding:12px;color:var(--text);font-family:var(--sans);font-size:0.9rem;line-height:1.5;
  }
  .notes-preview h1, .notes-preview h2, .notes-preview h3, .notes-preview h4{margin:0.8em 0 0.4em;color:var(--text);}
  .notes-preview p{margin:0.5em 0;}
  .notes-preview ul, .notes-preview ol{margin:0.5em 0;padding-left:1.5em;}
  .notes-preview code{background:rgba(255,255,255,0.1);padding:2px 5px;border-radius:3px;font-family:var(--mono);font-size:0.85rem;}
  .notes-preview pre{background:rgba(0,0,0,0.4);border:1px solid var(--line);border-radius:4px;padding:10px;overflow:auto;}
  .notes-preview pre code{background:transparent;padding:0;}
  .notes-preview blockquote{border-left:3px solid var(--accent);margin:0.5em 0;padding-left:12px;color:var(--text-dim);}
  .notes-preview a{color:var(--accent);}
  .notes-preview hr{border:none;border-top:1px solid var(--line);margin:1em 0;}
  .notes-status{font-family:var(--mono);font-size:0.7rem;color:var(--text-dim);min-height:1.2em;text-align:right;}
  @media (max-width:900px){.notes-panel{display:none;}}
  .group-card{
    background:var(--panel);border:1px solid var(--line);border-radius:5px;overflow:hidden;cursor:pointer;
    transition:border-color .15s,transform .15s;display:flex;flex-direction:column;
  }
  .group-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .thumb-wrap{position:relative;aspect-ratio:16/10;background:#050506;overflow:hidden;}
  .thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb-count{
    position:absolute;bottom:8px;right:8px;background:var(--badge-bg);color:var(--text);
    font-family:var(--mono);font-size:0.72rem;padding:2px 8px;border-radius:20px;
  }
  .card-actions{
    position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .15s;
  }
  .group-card:hover .card-actions{opacity:1;}
  .card-actions button{
    background:var(--dark-control-bg);color:var(--text);border:none;border-radius:4px;
    width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-size:0.85rem;line-height:1;
  }
  .card-actions button:hover{background:var(--danger);color:#fff;}
  .card-actions button.move-up:hover, .card-actions button.move-down:hover{background:var(--accent);color:#1a1305;}
  .card-drag-handle{
    position:absolute;top:8px;left:8px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
    background:var(--dark-control-bg);border-radius:4px;color:var(--text);cursor:grab;font-size:0.85rem;line-height:1;
    opacity:0;transition:opacity .15s;
  }
  .group-card:hover .card-drag-handle{opacity:1;}
  .group-card.dragging{opacity:0.4;}
  .group-card.drop-before{border-top:2px solid var(--accent);}
  .group-card.drop-after{border-bottom:2px solid var(--accent);}
  .card-body{padding:12px 14px 14px;display:flex;flex:1;flex-direction:column;gap:8px;}
  .card-tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
  .card-meta{font-family:var(--mono);font-size:0.7rem;color:var(--text-dim);display:flex;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:8px;}

  .empty-state{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--text-dim);}
  .empty-state .big{font-family:var(--serif);font-size:1.3rem;color:var(--text);margin-bottom:8px;}

  .ungrouped-bar{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:0.8rem;color:var(--text-dim);
  }
  #createGroupBtn{
    background:var(--accent);color:#1a1305;border:none;padding:9px 18px;border-radius:3px;
    font-family:var(--sans);font-size:0.85rem;font-weight:600;cursor:pointer;transition:opacity .15s;
  }
  #createGroupBtn:disabled{opacity:0.3;cursor:default;}
  #createGroupBtn:not(:disabled):hover{opacity:0.88;}
  .danger-btn{
    background:var(--danger);color:#1a1305;border:none;padding:9px 18px;border-radius:3px;
    font-family:var(--sans);font-size:0.85rem;font-weight:600;cursor:pointer;transition:opacity .15s;
  }
  .danger-btn:disabled{opacity:0.3;cursor:default;}
  .danger-btn:not(:disabled):hover{opacity:0.88;}
  #ungroupedGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:26px;}
  .ungrouped-card{
    position:relative;background:var(--panel);border:1px solid var(--line);border-radius:5px;overflow:hidden;
    cursor:pointer;transition:border-color .15s;
  }
  .ungrouped-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .ungrouped-card .thumb{aspect-ratio:4/3;background:#050506;overflow:hidden;}
  .ungrouped-card .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .ungrouped-card .fname{
    font-family:var(--mono);font-size:0.68rem;color:var(--text-dim);padding:6px 8px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .ungrouped-card .checkbox{
    position:absolute;top:8px;left:8px;width:20px;height:20px;border-radius:4px;
    border:2px solid var(--checkbox-border);background:var(--checkbox-bg);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.75rem;
  }
  .ungrouped-card.selected .checkbox{background:var(--accent);border-color:var(--accent);color:#1a1305;}
  .ungrouped-card .quick-add{
    position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;
    background:var(--dark-control-bg);border:1px solid var(--btn-border);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:0.95rem;cursor:pointer;
    opacity:0;transition:opacity .15s;
  }
  .ungrouped-card:hover .quick-add{opacity:1;}
  .ungrouped-card .quick-add:hover{background:var(--accent);color:#1a1305;border-color:var(--accent);}
  .ungrouped-card .delete-btn{
    position:absolute;top:8px;right:36px;width:24px;height:24px;border-radius:50%;
    background:var(--dark-control-bg);border:1px solid var(--btn-border);color:var(--danger);
    display:flex;align-items:center;justify-content:center;font-size:0.85rem;cursor:pointer;
    opacity:0;transition:opacity .15s;
  }
  .ungrouped-card:hover .delete-btn{opacity:1;}
  .delete-btn:hover{background:var(--danger);color:#1a1305;border-color:var(--danger);}

  #viewer{display:none;position:fixed;inset:0;background:#000;z-index:50;flex-direction:column;}
  .viewer-stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .viewer-stage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none;}
  .nav-zone{position:absolute;top:0;bottom:0;width:16%;display:flex;align-items:center;background:transparent;border:none;cursor:pointer;transition:background .15s;}
  .nav-zone:hover{background:var(--nav-zone-hover);}
  .nav-zone.left{left:0;justify-content:flex-start;padding-left:10px;}
  .nav-zone.right{right:0;justify-content:flex-end;padding-right:10px;}
  .nav-zone svg{opacity:0;width:28px;height:28px;transition:opacity .15s;}
  .nav-zone:hover svg{opacity:0.8;}

  .viewer-topbar{
    position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:16px 20px;background:linear-gradient(to bottom, var(--top-bar-gradient-start), transparent);z-index:2;pointer-events:none;
  }
  .viewer-topbar > *{pointer-events:auto;}
  .viewer-counter{font-family:var(--mono);font-size:0.8rem;color:rgba(255,255,255,0.85);}
  .viewer-filename{font-family:var(--mono);font-size:0.78rem;color:rgba(255,255,255,0.55);margin-left:12px;}
  .viewer-topbar-left{display:flex;align-items:baseline;}
  .viewer-topbar-right{display:flex;align-items:center;gap:8px;}
  .close-btn{
    background:var(--dark-control-bg);border:1px solid var(--btn-border);color:#fff;
    width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1rem;line-height:1;
  }
  .close-btn:hover{background:var(--btn-hover-bg);color:#1a1305;}
  .remove-btn{
    background:var(--dark-control-bg);border:1px solid var(--btn-border);color:var(--danger);
    width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1rem;line-height:1;
  }
  .remove-btn:hover{background:var(--remove-hover-bg);color:#fff;}
  .add-btn{
    background:var(--dark-control-bg);border:1px solid var(--btn-border);color:var(--accent);
    width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.2rem;line-height:1;
  }
  .add-btn:hover{background:var(--add-hover-bg);color:#1a1305;}

  #addImagePanel{
    display:none;position:absolute;left:0;right:0;bottom:0;max-height:45%;background:rgba(8,9,10,0.96);
    border-top:1px solid var(--line);z-index:20;flex-direction:column;padding:14px 20px 18px;
  }
  .add-image-header{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;
    font-family:var(--mono);font-size:0.8rem;color:var(--text-dim);
  }
  .add-image-header button{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:1rem;}
  .add-image-header button:hover{color:var(--text);}
  .add-image-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;
    overflow-y:auto;padding-right:4px;
  }
  .add-image-card{
    position:relative;background:var(--panel);border:1px solid var(--line);border-radius:5px;
    overflow:hidden;cursor:pointer;transition:border-color .15s;
  }
  .add-image-card:hover{border-color:var(--accent);}
  .add-image-card .thumb{aspect-ratio:4/3;background:#050506;overflow:hidden;}
  .add-image-card .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .add-image-card .fname{
    font-family:var(--mono);font-size:0.65rem;color:var(--text-dim);padding:5px 7px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .add-image-card .plus{
    position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;
    background:var(--accent);color:#1a1305;border:none;display:flex;align-items:center;
    justify-content:center;font-size:0.85rem;font-weight:700;
  }
  .add-image-empty{text-align:center;color:var(--text-dim);font-size:0.85rem;padding:20px;}

  .viewer-bottombar{
    position:absolute;left:0;right:0;bottom:0;padding:16px 20px 20px;z-index:2;
    background:linear-gradient(to top, var(--bottom-bar-gradient-start), transparent);
    display:flex;flex-direction:column;gap:10px;pointer-events:none;
  }
  .viewer-bottombar > *{pointer-events:auto;}
  .thumb-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;align-items:center;}
  .thumb-item{position:relative;flex-shrink:0;cursor:pointer;}
  .thumb-item img{
    height:52px;width:74px;object-fit:cover;border-radius:3px;cursor:pointer;
    border:2px solid transparent;opacity:0.55;transition:opacity .15s,border-color .15s;background:#111;display:block;
  }
  .thumb-item img.active{opacity:1;border-color:var(--accent);}
  .thumb-item .thumb-drag-handle{
    position:absolute;top:2px;left:2px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;
    background:var(--dark-control-bg);border-radius:3px;color:#fff;font-size:0.75rem;line-height:1;cursor:grab;opacity:0;transition:opacity .15s;
  }
  .thumb-item:hover .thumb-drag-handle{opacity:1;}
  .thumb-item .thumb-move{
    position:absolute;top:50%;transform:translateY(-50%);width:18px;height:18px;display:flex;align-items:center;justify-content:center;
    background:var(--dark-control-bg);border:none;border-radius:3px;color:#fff;font-size:0.75rem;cursor:pointer;opacity:0;transition:opacity .15s;
  }
  .thumb-item:hover .thumb-move{opacity:1;}
  .thumb-item .thumb-move.left{left:2px;}
  .thumb-item .thumb-move.right{right:2px;}
  .thumb-item.dragging{opacity:0.4;}
  .thumb-item.drop-before::before, .thumb-item.drop-after::after{content:'';position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:2;}
  .thumb-item.drop-before::before{left:-4px;}
  .thumb-item.drop-after::after{right:-4px;}
  .viewer-info{display:flex;flex-direction:column;gap:8px;}
  .viewer-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:28px;}
  .tag-pill{
    display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:0.72rem;color:#f0dab3;
    background:var(--tag-pill-bg);padding:3px 6px 3px 10px;border-radius:20px;border:1px solid var(--tag-pill-border);
  }
  .tag-pill button{background:none;border:none;color:inherit;opacity:0.7;cursor:pointer;font-size:0.95rem;line-height:1;padding:0 2px;}
  .tag-pill button:hover{opacity:1;color:var(--danger);}
  .add-tag-pill{
    display:flex;align-items:center;gap:4px;background:var(--add-pill-bg);border:1px dashed var(--add-pill-border);
    border-radius:20px;padding:3px 10px;
  }
  .add-tag-pill input{
    background:none;border:none;color:#fff;font-family:var(--mono);font-size:0.72rem;width:90px;outline:none;
  }
  .add-tag-pill input::placeholder{color:rgba(255,255,255,0.65);}
  .add-tag-pill button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:0.85rem;padding:0;}

  /* Fullscreen viewer pills: more opaque background + white text for legibility
     against a photo, while keeping each pill's tint (amber/blue/pink) for
     at-a-glance category recognition. Card-grid pills keep their original
     look since they sit on a plain dark panel, not a photo. */
  .tags-row .tag-pill{background:var(--fullscreen-tag-bg);border-color:rgba(201,154,75,1);color:#fff;}
  .news-row .link-pill.news{background:var(--fullscreen-news-bg);border-color:rgba(91,140,201,1);color:#fff;}
  .videos-row .link-pill.video{background:var(--fullscreen-video-bg);border-color:rgba(201,91,140,1);color:#fff;}

  .viewer-links{display:flex;gap:8px;flex-wrap:wrap;}
  .link-pill{
    display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:0.72rem;text-decoration:none;
    padding:3px 12px;border-radius:20px;border:1px solid transparent;transition:opacity .15s;
  }
  .link-pill a{color:inherit;text-decoration:none;}
  .link-pill:hover{opacity:0.9;}
  .link-pill.news{color:#fff;background:var(--link-pill-news-bg);border-color:var(--link-pill-news-border);}
  .link-pill.video{color:#fff;background:var(--link-pill-video-bg);border-color:var(--link-pill-video-border);}
  .link-pill.disabled{opacity:0.35;pointer-events:none;}
  .link-pill button{background:none;border:none;color:inherit;opacity:0.7;cursor:pointer;font-size:0.95rem;line-height:1;padding:0 0 0 2px;}
  .link-pill button:hover{opacity:1;color:var(--danger);}
  .add-link-pill{
    display:flex;align-items:center;gap:4px;background:var(--add-pill-bg);border:1px dashed var(--add-pill-border);
    border-radius:20px;padding:3px 10px;
  }
  .add-link-pill input{
    background:none;border:none;color:#fff;font-family:var(--mono);font-size:0.72rem;width:150px;outline:none;
  }
  .add-link-pill input::placeholder{color:rgba(255,255,255,0.65);}
  .news-slot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .videos-slot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .filter-toggle{
    display:inline-flex;align-items:center;gap:4px;
    background:var(--btn-bg);border:1px solid var(--btn-border);border-radius:20px;
    padding:3px 10px;font-family:var(--mono);font-size:0.72rem;color:var(--text-dim);
    cursor:pointer;transition:all .15s;white-space:nowrap;
  }
  .filter-toggle:hover{background:var(--btn-hover-bg);border-color:var(--accent);color:var(--accent);}
  .filter-toggle.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}

  .settings-panel{
    width:min(480px, calc(100vw - 40px));background:var(--panel);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 16px 48px rgba(0,0,0,0.5);display:flex;flex-direction:column;max-height:calc(100vh - 40px);
  }
  .settings-header{
    display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);
  }
  .settings-header h2{margin:0;font-family:var(--serif);font-size:1.25rem;font-weight:400;color:var(--text);}
  .settings-header button{
    background:none;border:none;color:var(--text-dim);font-size:1.1rem;cursor:pointer;width:30px;height:30px;border-radius:4px;
  }
  .settings-header button:hover{background:var(--btn-hover-bg);color:var(--text);}
  .settings-body{padding:18px 20px;display:flex;flex-direction:column;gap:18px;overflow:auto;}
  .setting-row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    font-size:0.85rem;color:var(--text);
  }
  .setting-row > span:first-child{min-width:140px;}
  .setting-value{font-family:var(--mono);color:var(--text-dim);min-width:42px;text-align:right;}
  .setting-row input[type="range"]{flex:1;min-width:120px;accent-color:var(--accent);}
  .setting-row input[type="number"]{
    width:64px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;color:var(--text);
    padding:5px 8px;font-family:var(--mono);font-size:0.8rem;
  }
  .setting-row input[type="number"]:focus{outline:none;border-color:var(--accent);}
  .setting-row input[type="number"]:disabled{opacity:0.4;cursor:not-allowed;}
  .setting-row input[type="checkbox"]{
    width:18px;height:18px;accent-color:var(--accent);cursor:pointer;
  }
  .setting-options{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .lookback-preset{
    background:var(--panel-2);border:1px solid var(--line);border-radius:20px;color:var(--text-dim);
    padding:4px 12px;font-family:var(--mono);font-size:0.75rem;cursor:pointer;transition:all .15s;
  }
  .lookback-preset:hover{border-color:var(--accent);color:var(--accent);}
  .lookback-preset.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
  .custom-lookback{display:flex;align-items:center;gap:6px;color:var(--text-dim);font-size:0.8rem;}

  .settings-footer{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:14px 20px;border-top:1px solid var(--line);}
  .apply-btn{
    background:var(--accent);color:#1a1305;border:none;padding:8px 18px;border-radius:3px;
    font-family:var(--sans);font-size:0.85rem;font-weight:600;cursor:pointer;transition:opacity .15s;
  }
  .apply-btn:hover:not(:disabled){opacity:0.88;}
  .apply-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .settings-status{font-family:var(--mono);font-size:0.75rem;color:var(--accent);min-height:1.2em;}

  @media (max-width:640px){
    header{padding:14px 16px;}
    main{padding:16px;}
    .search-inline{flex-basis:100%;}
    .header-top .right{flex-basis:100%;justify-content:space-between;}
    #results{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
    .viewer-bottombar{padding:12px 14px 16px;}
    .thumb-strip img{height:40px;width:58px;}
  }

  /* Awesomplete dark overrides */
  .awesomplete{display:inline-block;vertical-align:top;}
  .awesomplete > ul{
    left:0; right:auto; top:100%;
    z-index:100;
    min-width:100%; width:auto; max-width:min(320px, calc(100vw - 20px));
    max-height:50vh; overflow:auto;
    margin:6px 0 0;
    padding:0;
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    color:var(--text-dim);
    transform-origin:0 0;
  }
  .awesomplete > ul:empty{display:none;}
  .awesomplete > ul > li{padding:6px 10px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .awesomplete > ul > li:hover, .awesomplete > ul > li[aria-selected="true"]{background:var(--accent-dim); color:var(--accent);}
  .awesomplete mark{background:transparent; color:var(--accent); font-weight:600;}
  .awesomplete > ul:before{display:none;}
  /* Open upward inside the fixed viewer bottom bar */
  .viewer-row .awesomplete > ul{top:auto; bottom:100%; margin:0 0 6px; transform-origin:0 100%;}
  /* Group cards need visible overflow so the dropdown isn't clipped */
  .group-card{overflow:visible;}
  /* Header filter: make Awesomplete wrapper fill the flex area */
  .search-inline .awesomplete{flex:1; display:block;}
  .search-inline .awesomplete > input{width:100%;}
</style>
</head>
<body>

  <div id="loadError">
    <div class="big">Couldn't load the archive</div>
    <div id="loadErrorMsg">—</div>
    <p style="font-size:0.8rem;margin-top:14px;">
      Make sure the server is running and <code>DATA_FILE</code> / <code>IMAGES_DIR</code> point at your files.
    </p>
  </div>

  <div id="archive">
    <header>
      <div class="header-top">
        <h1>Archive</h1>
        <div class="search-inline">
          <input type="text" id="tagInput" placeholder="Type a tag and press Enter…" autocomplete="off">
          <div class="mode-toggle">
            <button id="modeOr">OR</button>
            <button id="modeAnd" class="active">AND</button>
          </div>
        </div>
        <div class="right">
          <div class="mode-toggle" id="viewToggle">
            <button id="groupsBtn" class="active" title="Show grouped images">Groups (0)</button>
            <button id="ungroupedBtn" title="Show images not yet in any group">Ungrouped (0)</button>
          </div>
          <button class="rescan-btn" id="rescanBtn" title="Re-scan the images folder for new files">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg>
            <span id="rescanLabel">Rescan</span>
          </button>
          <button class="rescan-btn" id="settingsBtn" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Settings</span>
          </button>
        </div>
      </div>
      <div class="chips" id="activeChips"></div>
      <div class="tag-suggestions" id="tagSuggestions"></div>
    </header>
    <main>
      <div id="ungroupedPanel" style="display:none;">
        <div class="ungrouped-bar">
          <span id="ungroupedCount">0 ungrouped images</span>
          <div style="display:flex;gap:10px;align-items:center;">
            <button id="deleteSelectedBtn" class="danger-btn" disabled>Delete selected (<span id="deleteSelectedCount">0</span>)</button>
            <button id="createGroupBtn" disabled>Create group from selected (<span id="selectedCount">0</span>)</button>
          </div>
        </div>
        <div id="ungroupedGrid"></div>
      </div>
      <div id="results"></div>
      <aside class="notes-panel" id="notesPanel">
        <div class="notes-header">
          <h3>Notes</h3>
          <div class="notes-tabs">
            <button id="notesEditTab">Write</button>
            <button class="active" id="notesPreviewTab">Preview</button>
          </div>
        </div>
        <div class="notes-toolbar" id="notesToolbar">
          <button type="button" data-md="bold" title="Bold"><b>B</b></button>
          <button type="button" data-md="italic" title="Italic"><i>I</i></button>
          <button type="button" data-md="link" title="Link">🔗</button>
          <span class="toolbar-sep"></span>
          <button type="button" data-md="h2" title="Heading">H</button>
          <button type="button" data-md="ul" title="Bulleted list">•</button>
          <button type="button" data-md="ol" title="Numbered list">1.</button>
          <button type="button" data-md="indent" title="Indent">⇥</button>
          <button type="button" data-md="outdent" title="Outdent">⇤</button>
          <span class="toolbar-sep"></span>
          <button type="button" data-md="code" title="Code">&lt;/&gt;</button>
          <button type="button" data-md="quote" title="Quote">”</button>
        </div>
        <textarea id="notesText" placeholder="Markdown notes..." spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
        <div id="notesPreview" class="notes-preview" style="display:none;"></div>
        <div class="notes-status" id="notesStatus"></div>
      </aside>
    </main>
  </div>



  <div id="viewer">
    <div class="viewer-stage">
      <button class="nav-zone left" id="prevBtn" aria-label="Previous image">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <img id="stageImg" src="" alt="">
      <button class="nav-zone right" id="nextBtn" aria-label="Next image">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="viewer-topbar">
      <div class="viewer-topbar-left">
        <span class="viewer-counter" id="viewerCounter">1 / 1</span>
        <span class="viewer-filename" id="viewerFilename"></span>
      </div>
      <div class="viewer-topbar-right">
        <button class="add-btn" id="addImgBtn" title="Add image to group">+</button>
        <button class="remove-btn" id="removeImgBtn" title="Remove image from group">🗑</button>
        <button class="close-btn" id="closeBtn" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="viewer-bottombar">
      <div class="thumb-strip" id="thumbStrip"></div>
      <div class="viewer-info" id="viewerInfo">
        <div class="viewer-tags" id="viewerTags"></div>
        <div class="viewer-links" id="viewerLinks"></div>

    </div>
    <div id="addImagePanel">
      <div class="add-image-header">
        <span>Add ungrouped image to group</span>
        <button id="closeAddPanel" aria-label="Close">&#10005;</button>
      </div>
      <div class="add-image-grid" id="addImageGrid"></div>
    </div>
  </div>

  <div id="settingsDialog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;">
    <div class="settings-panel">
      <div class="settings-header">
        <h2>Settings</h2>
        <button id="closeSettings" aria-label="Close">&#10005;</button>
      </div>
      <div class="settings-body">
        <label class="setting-row">
          <span>Control opacity</span>
          <input type="range" id="opacitySlider" min="0" max="100" value="100">
          <span id="opacityValue" class="setting-value">100%</span>
        </label>
        <div class="setting-row">
          <span>Default tag filter</span>
          <div class="mode-toggle" id="settingsFilterToggle">
            <button data-mode="or" id="settingsModeOr">OR</button>
            <button data-mode="and" id="settingsModeAnd" class="active">AND</button>
          </div>
        </div>
        <div class="setting-row">
          <span>News lookback</span>
          <div class="setting-options">
            <button class="lookback-preset" data-days="14">2w</button>
            <button class="lookback-preset" data-days="21">3w</button>
            <button class="lookback-preset" data-days="35">5w</button>
            <label class="custom-lookback">
              <input type="number" id="customLookback" min="1" max="365" value="14">
              <span>days</span>
            </label>
          </div>
        </div>
        <label class="setting-row">
          <span>Periodic rescan</span>
          <div class="setting-options">
            <input type="checkbox" id="periodicRescanEnabled">
            <input type="number" id="periodicRescanMinutes" min="1" max="1440" value="30" disabled>
            <span>min</span>
          </div>
        </label>
      </div>
      <div class="settings-footer">
        <span id="settingsStatus" class="settings-status"></span>
        <button id="applySettings" class="apply-btn">Apply</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/awesomplete@1.1.7/awesomplete.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.min.js"></script>
<script>
(function(){
  "use strict";

  let archiveData = null;
  let currentResults = [];
  let activeTags = [];
  let dragSourceGroup = null;
  let viewerGroup = null;
  let viewerIndex = 0;
  let ungroupedFiles = [];
  let selectedUngrouped = new Set();
  let selectedHistory = []; // LIFO order of image selections for Esc unselect
  let showingUngrouped = false;
  let allImages = []; // every image filename indexed on disk, for news-date suggestions

  const MS_PER_DAY = 24 * 60 * 60 * 1000;

  const defaultSettings = {
    controlOpacity: 100,           // 0-100; 100 = fully opaque controls
    tagFilterMode: 'and',          // 'and' | 'or'
    newsLookbackDays: 14,          // days
    newsDateFilterEnabled: true,   // news date-window toggle in viewer
    periodicRescanMinutes: 0       // 0 = disabled
  };
  let settings = { ...defaultSettings };
  let mode = settings.tagFilterMode;
  let newsDateFilter = settings.newsDateFilterEnabled;
  let rescanIntervalId = null;

  function loadSettings(){
    try {
      const saved = localStorage.getItem('archiveSettings');
      if(saved){
        const parsed = JSON.parse(saved);
        Object.assign(settings, parsed);
      }
    } catch(e) {}
    // Clamp/normalize.
    settings.controlOpacity = Math.max(0, Math.min(100, Number(settings.controlOpacity) || 100));
    if(!['and','or'].includes(settings.tagFilterMode)) settings.tagFilterMode = 'and';
    settings.newsLookbackDays = Math.max(1, Math.min(365, Number(settings.newsLookbackDays) || 14));
    settings.newsDateFilterEnabled = settings.newsDateFilterEnabled !== false;
    settings.periodicRescanMinutes = Math.max(0, Math.min(1440, Number(settings.periodicRescanMinutes) || 0));
    mode = settings.tagFilterMode;
    newsDateFilter = settings.newsDateFilterEnabled;
  }

  function saveSettings(){
    try { localStorage.setItem('archiveSettings', JSON.stringify(settings)); } catch(e) {}
  }

  function rgba(r, g, b, a){
    a = Math.max(0, Math.min(1, a));
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a.toFixed(3) + ')';
  }

  function applyControlOpacity(){
    // 0% = fully transparent, 100% = maximum opacity for each control.
    // Dark controls and tinted pills can reach full opacity; white translucent
    // controls are capped lower so their text/icons remain readable.
    const a = settings.controlOpacity / 100;
    document.documentElement.style.setProperty('--btn-bg', rgba(255,255,255, 0.25 * a));
    document.documentElement.style.setProperty('--btn-border', rgba(255,255,255, 0.50 * a));
    document.documentElement.style.setProperty('--btn-hover-bg', rgba(255,255,255, 0.35 * a));
    document.documentElement.style.setProperty('--add-pill-bg', rgba(30,30,35, 0.85 * a));
    document.documentElement.style.setProperty('--add-pill-border', rgba(255,255,255, 0.40 * a));
    document.documentElement.style.setProperty('--dark-control-bg', rgba(0,0,0, 1.00 * a));
    document.documentElement.style.setProperty('--top-bar-gradient-start', rgba(0,0,0, 1.00 * a));
    document.documentElement.style.setProperty('--bottom-bar-gradient-start', rgba(0,0,0, 1.00 * a));
    document.documentElement.style.setProperty('--nav-zone-hover', rgba(255,255,255, 0.10 * a));
    document.documentElement.style.setProperty('--header-bg', rgba(12,13,15, 1.00 * a));
    document.documentElement.style.setProperty('--badge-bg', rgba(0,0,0, 1.00 * a));
    document.documentElement.style.setProperty('--checkbox-bg', rgba(0,0,0, 0.80 * a));
    document.documentElement.style.setProperty('--checkbox-border', rgba(255,255,255, 1.00 * a));
    document.documentElement.style.setProperty('--tag-pill-bg', rgba(201,154,75, 0.70 * a));
    document.documentElement.style.setProperty('--tag-pill-border', rgba(201,154,75, 1.00 * a));
    document.documentElement.style.setProperty('--link-pill-news-bg', rgba(91,140,201, 0.70 * a));
    document.documentElement.style.setProperty('--link-pill-news-border', rgba(91,140,201, 1.00 * a));
    document.documentElement.style.setProperty('--link-pill-video-bg', rgba(201,91,140, 0.70 * a));
    document.documentElement.style.setProperty('--link-pill-video-border', rgba(201,91,140, 1.00 * a));
    document.documentElement.style.setProperty('--fullscreen-tag-bg', rgba(201,154,75, 1.00 * a));
    document.documentElement.style.setProperty('--fullscreen-news-bg', rgba(91,140,201, 1.00 * a));
    document.documentElement.style.setProperty('--fullscreen-video-bg', rgba(201,91,140, 1.00 * a));
    document.documentElement.style.setProperty('--remove-hover-bg', rgba(201,107,75, 0.50 * a));
    document.documentElement.style.setProperty('--add-hover-bg', rgba(201,154,75, 0.50 * a));
  }

  function applyTagFilterMode(){
    mode = settings.tagFilterMode;
    if(modeOrBtn) modeOrBtn.classList.toggle('active', mode === 'or');
    if(modeAndBtn) modeAndBtn.classList.toggle('active', mode === 'and');
    if(archiveData) renderResults();
  }

  function applyNewsLookback(){
    // News lookback is read from settings.newsLookbackDays wherever NEWS_LOOKBACK_DAYS was used.
    if(archiveData) renderResults();
  }

  function applyPeriodicRescan(){
    if(rescanIntervalId){
      clearInterval(rescanIntervalId);
      rescanIntervalId = null;
    }
    if(settings.periodicRescanMinutes > 0){
      rescanIntervalId = setInterval(doRescan, settings.periodicRescanMinutes * 60 * 1000);
    }
  }

  function applySettings(){
    applyControlOpacity();
    applyTagFilterMode();
    applyPeriodicRescan();
    // News lookback is applied on next render of news suggestions.
    if(archiveData) renderResults();
  }

  const imgUrl = (filename) => filename ? ('/images/' + encodeURIComponent(filename)) : '';

  // Pulls the first YYYY-MM-DD out of a filename, e.g. "2026-08-27-001.png"
  // or "Screenshot from 2026-09-06 10-30-25.png", and returns it as a
  // UTC-midnight timestamp for correct date math across month/year boundaries.
  // Returns null if the filename doesn't contain a date.
  function extractDateTs(filename){
    const m = /(\d{4})-(\d{2})-(\d{2})/.exec(filename || '');
    if(!m) return null;
    return Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  }

  // A group has no single stable id, so we identify it by its first file
  // when talking to the tag API — any file in the group works.
  async function apiChangeTags(group, { add = [], remove = [] }){
    const fn = (group.files || [])[0];
    const res = await fetch('/api/groups/' + encodeURIComponent(fn) + '/tags', {

      headers: { 'Content-Type': 'application/json' },

    group.tags = data.tags;
    if(Array.isArray(data.allTags) && archiveData) archiveData.tags = data.allTags;
    return group.tags;
  }

  // Small helper to attach an Awesomplete dropdown to an input.
  // `onSelect` is called with the chosen (or typed) value.
  function attachAwesomplete(input, list, onSelect, opts = {}){
    const aw = new Awesomplete(input, {
      list,
      minChars: 0,
      maxItems: 1000,
      autoFirst: true,
      filter: Awesomplete.FILTER_CONTAINS,
      sort: false,
      tabSelect: false,
      ...opts
    });
    input.addEventListener('focus', () => aw.evaluate());
    input.addEventListener('awesomplete-selectcomplete', (e) => {
      onSelect(e.text.value);
      input.value = '';
      aw.close();
    });
    if(opts.allowFreeText !== false){
      input.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' && input.value.trim()){
          onSelect(input.value.trim());
          input.value = '';
          aw.close();
        }
      });
    }
    return aw;
  }

  // Renders an editable set of tag pills into `container` for `group`,
  // calling `onChange` after any successful add/remove so the caller
  // can re-render itself (e.g. the viewer chrome).
  function renderEditableTags(container, group, onChange){
    container.innerHTML = '';
    const sortedTags = [...(group.tags || [])].sort((a, b) => a.localeCompare(b));

    const addPill = document.createElement('div');
    addPill.className = 'add-tag-pill';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '+ add tag';
    input.addEventListener('click', (e) => e.stopPropagation());
    addPill.appendChild(input);
    container.appendChild(addPill);

    const currentTags = new Set(group.tags || []);
    attachAwesomplete(
      input,
      allTags().filter(t => !currentTags.has(t)),
      (value) => addTagToGroup(group, value, onChange)
    );

    sortedTags.forEach(tag => {
      const pill = document.createElement('span');
      pill.className = 'tag-pill';
      const label = document.createElement('span');
      label.textContent = tag;
      pill.appendChild(label);
      const removeBtn = document.createElement('button');
      removeBtn.textContent = '×';
      removeBtn.title = 'Remove tag';
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        removeTagFromGroup(group, tag, onChange);
      });
      pill.appendChild(removeBtn);
      container.appendChild(pill);
    });
  }

  function allTags(){
    const set = new Set();
    if(archiveData && Array.isArray(archiveData.tags)){
      archiveData.tags.forEach(t => set.add(t));

    // Also pick up any tags that exist only in groups (e.g. legacy data).
    if(archiveData && Array.isArray(archiveData.files)){
      archiveData.files.forEach(g => (g.tags || []).forEach(t => set.add(t)));
    }
    return Array.from(set).sort((a,b) => a.localeCompare(b));
  }

  function getInputSelection(input){
    const start = input.selectionStart;
    const end = input.selectionEnd;
    const text = input.value;
    return { start, end, before: text.slice(0, start), selected: text.slice(start, end), after: text.slice(end) };
  }

  function setInputSelection(input, start, end){
    input.setSelectionRange(start, end);
    input.focus();
  }

  function prefixLines(text, prefix){
    if(!text) return prefix;
    return text.split('\n').map(line => {
      if(line.trim() === '') return line;
      return prefix + line;
    }).join('\n');
  }

  function indentLines(text, spaces){
    const indent = ' '.repeat(spaces);
    if(!text) return indent;
    return text.split('\n').map(line => {
      if(line === '') return line;
      return indent + line;
    }).join('\n');
  }

  function outdentLines(text, spaces){
    if(!text) return text;
    const indent = ' '.repeat(spaces);
    return text.split('\n').map(line => {
      if(line.startsWith(indent)) return line.slice(spaces);
      if(line.startsWith('\t')) return line.slice(1);
      return line;
    }).join('\n');
  }

  function insertMarkdown(type){
    if(notesMode !== 'edit') setNotesMode('edit');
    const { start, end, before, selected, after } = getInputSelection(notesText);
    let replacement = selected;
    let newStart = start;
    let newEnd = end;

    switch(type){
      case 'bold':
        replacement = '**' + (selected || 'bold text') + '**';
        newStart = start + 2;
        newEnd = newStart + (selected ? selected.length : 'bold text'.length);
        break;
      case 'italic':
        replacement = '*' + (selected || 'italic text') + '*';
        newStart = start + 1;
        newEnd = newStart + (selected ? selected.length : 'italic text'.length);
        break;
      case 'link':
        if(selected && /^https?:\/\//.test(selected)){
          replacement = '[' + selected + '](' + selected + ')';
          newStart = start + 1;
          newEnd = start + 1 + selected.length;
        }else{
          replacement = '[' + (selected || 'link text') + '](url)';
          newStart = start + 1;
          newEnd = newStart + (selected ? selected.length : 'link text'.length);
        }
        break;
      case 'h2':
        replacement = '## ' + (selected || 'Heading');
        newStart = start + 3;
        newEnd = newStart + (selected ? selected.length : 'Heading'.length);
        break;
      case 'ul':
        replacement = prefixLines(selected || 'list item', '- ');
        newStart = start;
        newEnd = newStart + replacement.length;
        break;
      case 'ol':
        replacement = prefixLines(selected || 'list item', '1. ');
        newStart = start;
        newEnd = newStart + replacement.length;
        break;
      case 'code':
        if(selected.includes('\n')){
          replacement = '```\n' + selected + '\n```';
          newStart = start + 4;
          newEnd = newStart + selected.length;
        }else{
          replacement = '`' + (selected || 'code') + '`';
          newStart = start + 1;
          newEnd = newStart + (selected ? selected.length : 'code'.length);
        }
        break;
      case 'quote':
        replacement = prefixLines(selected || 'quote', '> ');
        newStart = start;
        newEnd = newStart + replacement.length;
        break;
      case 'indent':
        replacement = indentLines(selected || '', 2);
        newStart = start + replacement.length;
        newEnd = newStart;
        break;
      case 'outdent':
        replacement = outdentLines(selected || '', 2);
        newStart = start + replacement.length;
        newEnd = newStart;
        break;
    }

    notesText.value = before + replacement + after;
    notesText.dispatchEvent(new Event('input', { bubbles: true }));
    setInputSelection(notesText, newStart, newEnd);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function renderResults(){
    currentResults = archiveData.files.filter(matchesGroup);
    groupsBtn.textContent = 'Groups (' + currentResults.length + ')';
    resultsEl.innerHTML = "";

    if(currentResults.length === 0){

  // Content shots follow "YYYY-MM-DD-NNN.png"-style sequential numbering;
  // news clippings are either a single dated file without that extra suffix
  // (e.g. "2026-08-24.png") or any file explicitly marked with "news" in
  // its name (e.g. "Screenshot from 2026-09-08 08-13-09-news.png"). We
  // anchor to the leading date and check what follows it, rather than
  // matching "-<digits>" anywhere at the end — a plain dated file's
  // day-of-month (e.g. the "24" in "2026-08-24.png") looks identical to a
  // numbered suffix if matched naively, which would wrongly exclude it too.
  function hasSequentialSuffix(filename){
    const m = /^\d{4}-\d{2}-\d{2}(.*)\.png$/i.exec(filename || '');
    if(!m) return false; // no leading date to anchor against — leave filtering to the date-window check
    return /^-\d+$/.test(m[1]); // anything between the date and ".png"
  }

  // Derives the paired news filename for a content file: "X.png" -> "X-news.png".
  function pairedNewsFilename(contentFilename){
    if(!contentFilename || !/\.png$/i.test(contentFilename)) return null;
    return contentFilename.replace(/\.png$/i, '-news.png');
  }

  // Suggests news clippings for a group.
  // 1. Exact filename pairs: for every content file "X.png", suggest "X-news.png"
  //    if it exists on disk. This pairs screenshot-style content with its
  //    corresponding news clipping even when many screenshots share a date.
  // 2. Date-window fallback (when dateFilter is true): images dated on the same
  //    day as, or up to NEWS_LOOKBACK_DAYS before, any of the group's own image
  //    dates. When dateFilter is false, the date restriction is removed and all
  //    files that look like news clippings are suggested.
  // Excludes files already in the group, plain screenshots, and
  // sequentially-numbered filenames unless they are explicitly marked
  // with "news" in their name.
  function suggestedNewsFiles(group, dateFilter = true){
    const groupFiles = group.files || [];
    const groupTimestamps = groupFiles.map(extractDateTs).filter(ts => ts !== null);
    if(dateFilter && groupTimestamps.length === 0) return [];
    const groupFileSet = new Set(groupFiles);
    const imageSet = new Set(allImages);
    const suggested = new Set();

    // 1. Exact filename pairs always suggested.
    groupFiles.forEach(fn => {
      const newsFn = pairedNewsFilename(fn);
      if(newsFn && imageSet.has(newsFn) && !groupFileSet.has(newsFn)){
        suggested.add(newsFn);
      }
    });

    // 2. Date-filtered or all-news suggestions.
    allImages.forEach(fn => {
      if(suggested.has(fn) || groupFileSet.has(fn)) return;
      const candidateTs = extractDateTs(fn);
      if(candidateTs === null) return;
      if(dateFilter){
        const inWindow = groupTimestamps.some(groupTs => {
          const daysBefore = (groupTs - candidateTs) / MS_PER_DAY;
          return daysBefore >= 0 && daysBefore <= settings.newsLookbackDays;
        });
        if(!inWindow) return;
      }
      // Explicit news marker overrides screenshot/sequential-suffix filters.
      if(/news/i.test(fn)) return suggested.add(fn);
      if(hasSequentialSuffix(fn)) return;
      if(/screenshot/i.test(fn)) return;
      suggested.add(fn);
    });

    return Array.from(suggested).sort((a, b) => a.localeCompare(b));
  }

      addPill.appendChild(input);
      container.appendChild(addPill);

      attachAwesomplete(
        input,

      );

      const filterBtn = document.createElement('button');
      filterBtn.className = 'filter-toggle' + (newsDateFilter ? ' active' : '');

        onChange();
      });
      container.appendChild(filterBtn);
    }
  }

    (viewerGroup.files || []).forEach((fn, i) => {

      const handle = document.createElement('div');
      handle.className = 'thumb-drag-handle';
      handle.textContent = '☰';
      handle.title = 'Drag to reorder';

      item.appendChild(handle);

      if((viewerGroup.files || []).length > 1){
        const leftBtn = document.createElement('button');
        leftBtn.className = 'thumb-move left';
        leftBtn.textContent = '←';
        leftBtn.title = 'Move left';
        leftBtn.addEventListener('click', (e) => { e.stopPropagation(); moveViewerFile(i, 'left'); });
        item.appendChild(leftBtn);

        const rightBtn = document.createElement('button');
        rightBtn.className = 'thumb-move right';
        rightBtn.textContent = '→';
        rightBtn.title = 'Move right';
        rightBtn.addEventListener('click', (e) => { e.stopPropagation(); moveViewerFile(i, 'right'); });
        item.appendChild(rightBtn);
      }

      item.draggable = true;
      item.addEventListener('dragstart', (e) => {
        dragSourceIndex = i;
        item.classList.add('dragging');
        e.dataTransfer.setData('text/plain', String(i));
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', () => {
        dragSourceIndex = null;
        item.classList.remove('dragging');
        document.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('drop-before', 'drop-after'));
      });
      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if(dragSourceIndex === null || dragSourceIndex === i) return;
        const rect = item.getBoundingClientRect();
        const midX = rect.left + rect.width / 2;
        const before = e.clientX < midX;
        item.classList.toggle('drop-before', before);
        item.classList.toggle('drop-after', !before);
      });
      item.addEventListener('dragleave', () => {
        item.classList.remove('drop-before', 'drop-after');
      });
      item.addEventListener('drop', (e) => {
        e.preventDefault();
        item.classList.remove('drop-before', 'drop-after');
        if(dragSourceIndex === null || dragSourceIndex === i) return;
        const rect = item.getBoundingClientRect();
        const midX = rect.left + rect.width / 2;
        const before = e.clientX < midX;
        const files = viewerGroup.files || [];
        const newFiles = [...files];
        const [moved] = newFiles.splice(dragSourceIndex, 1);
        let insertIndex = before ? i : i + 1;
        if(dragSourceIndex < i) insertIndex--;
        newFiles.splice(insertIndex, 0, moved);
        saveViewerFileOrder(newFiles, insertIndex);
      });

      thumbStrip.appendChild(item);
    });
  }

  function showViewerImage(){
    const files = viewerGroup.files || [];
    const fn = files[viewerIndex];
    stageImg.src = imgUrl(fn);
    stageImg.alt = fn || "";
    viewerCounter.textContent = (viewerIndex + 1) + ' / ' + files.length;
    viewerFilename.textContent = fn || "";
    Array.from(thumbStrip.children).forEach((el, i) => {
      const img = el.querySelector('img');
      if(img) img.classList.toggle('active', i === viewerIndex);
    });
  }

  async function saveViewerFileOrder(newFiles, newIndex){
    const fn = (viewerGroup.files || [])[0];
    if(!fn) return;
    try{
      const res = await fetch('/api/groups/' + encodeURIComponent(fn) + '/files/reorder', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ files: newFiles })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      viewerGroup.files = data.files;
      viewerIndex = Math.max(0, Math.min(newIndex, viewerGroup.files.length - 1));
      renderViewerChrome();
    }catch(err){ alert('Could not reorder images: ' + err.message); }
  }

  function moveViewerFile(fromIndex, direction){
    const files = viewerGroup.files || [];
    if(files.length < 2) return;
    const toIndex = direction === 'left' ? fromIndex - 1 : fromIndex + 1;
    if(toIndex < 0 || toIndex >= files.length) return;
    const newFiles = [...files];
    const [moved] = newFiles.splice(fromIndex, 1);
    newFiles.splice(toIndex, 0, moved);
    saveViewerFileOrder(newFiles, toIndex);
  }

  function nextImage(){
    const files = viewerGroup.files || [];
    viewerIndex = (viewerIndex + 1) % files.length;
    showViewerImage();
  }
  function prevImage(){
    const files = viewerGroup.files || [];
    viewerIndex = (viewerIndex - 1 + files.length) % files.length;
    showViewerImage();
  }

  const opacityValue = document.getElementById('opacityValue');
  const settingsModeOr = document.getElementById('settingsModeOr');
  const settingsModeAnd = document.getElementById('settingsModeAnd');
  const lookbackPresets = document.querySelectorAll('.lookback-preset');
  const customLookback = document.getElementById('customLookback');
  const periodicRescanEnabled = document.getElementById('periodicRescanEnabled');
  const periodicRescanMinutes = document.getElementById('periodicRescanMinutes');
  let stagedSettings = null;

  function settingsChanged(){
    if(!stagedSettings) return false;
    return (
      stagedSettings.controlOpacity !== settings.controlOpacity ||
      stagedSettings.tagFilterMode !== settings.tagFilterMode ||
      stagedSettings.newsLookbackDays !== settings.newsLookbackDays ||
      stagedSettings.periodicRescanMinutes !== settings.periodicRescanMinutes ||
      stagedSettings.newsDateFilterEnabled !== settings.newsDateFilterEnabled
    );
  }

  function updateApplyButtonState(){
    applySettingsBtn.disabled = !settingsChanged();
  }

  function updateLookbackPresets(){
    if(!stagedSettings) return;
    lookbackPresets.forEach(btn => {
      const days = Number(btn.dataset.days);
      btn.classList.toggle('active', days === stagedSettings.newsLookbackDays);
    });
    customLookback.value = stagedSettings.newsLookbackDays;
  }

  function openSettingsDialog(){
    stagedSettings = { ...settings };
    opacitySlider.value = stagedSettings.controlOpacity;
    opacityValue.textContent = stagedSettings.controlOpacity + '%';
    settingsModeOr.classList.toggle('active', stagedSettings.tagFilterMode === 'or');
    settingsModeAnd.classList.toggle('active', stagedSettings.tagFilterMode === 'and');
    updateLookbackPresets();
    periodicRescanEnabled.checked = stagedSettings.periodicRescanMinutes > 0;
    periodicRescanMinutes.disabled = stagedSettings.periodicRescanMinutes === 0;
    periodicRescanMinutes.value = stagedSettings.periodicRescanMinutes > 0 ? stagedSettings.periodicRescanMinutes : 30;
    settingsStatus.textContent = '';
    updateApplyButtonState();
    settingsDialog.style.display = 'flex';
  }

  function closeSettingsDialog(){
    stagedSettings = null;
    settingsDialog.style.display = 'none';
  }

  function applyDialogSettings(){
    if(!stagedSettings) return;
    settings = { ...stagedSettings };
    saveSettings();
    applySettings();
    updateApplyButtonState();
    settingsStatus.textContent = 'Applied';
    setTimeout(() => {
      if(settingsStatus.textContent === 'Applied') settingsStatus.textContent = '';
    }, 1500);
  }

  settingsBtn.addEventListener('click', openSettingsDialog);
  closeSettings.addEventListener('click', closeSettingsDialog);
  applySettingsBtn.addEventListener('click', applyDialogSettings);
  settingsDialog.addEventListener('click', (e) => {
    if(e.target === settingsDialog) closeSettingsDialog();
  });

  opacitySlider.addEventListener('input', () => {
    if(!stagedSettings) return;
    stagedSettings.controlOpacity = Number(opacitySlider.value);
    opacityValue.textContent = stagedSettings.controlOpacity + '%';
    updateApplyButtonState();
  });

  settingsModeOr.addEventListener('click', () => {
    if(!stagedSettings) return;
    stagedSettings.tagFilterMode = 'or';
    settingsModeOr.classList.add('active');
    settingsModeAnd.classList.remove('active');
    updateApplyButtonState();
  });
  settingsModeAnd.addEventListener('click', () => {
    if(!stagedSettings) return;
    stagedSettings.tagFilterMode = 'and';
    settingsModeAnd.classList.add('active');
    settingsModeOr.classList.remove('active');
    updateApplyButtonState();
  });

  lookbackPresets.forEach(btn => {
    btn.addEventListener('click', () => {
      if(!stagedSettings) return;
      stagedSettings.newsLookbackDays = Number(btn.dataset.days);
      updateLookbackPresets();
      updateApplyButtonState();
    });
  });

  customLookback.addEventListener('change', () => {
    if(!stagedSettings) return;
    let days = Number(customLookback.value);
    days = Math.max(1, Math.min(365, days));
    stagedSettings.newsLookbackDays = days;
    updateLookbackPresets();
    updateApplyButtonState();
  });

  periodicRescanEnabled.addEventListener('change', () => {
    if(!stagedSettings) return;
    periodicRescanMinutes.disabled = !periodicRescanEnabled.checked;
    if(periodicRescanEnabled.checked){
      let mins = Number(periodicRescanMinutes.value);
      mins = Math.max(1, Math.min(1440, mins));
      stagedSettings.periodicRescanMinutes = mins;
    } else {
      stagedSettings.periodicRescanMinutes = 0;
    }
    updateApplyButtonState();
  });

  periodicRescanMinutes.addEventListener('change', () => {
    if(!stagedSettings || !periodicRescanEnabled.checked) return;
    let mins = Number(periodicRescanMinutes.value);
    mins = Math.max(1, Math.min(1440, mins));
    stagedSettings.periodicRescanMinutes = mins;
    updateApplyButtonState();
  });

  function unselectMostRecentImage(){
    if(selectedHistory.length === 0) return;
    const fn = selectedHistory.pop();
    selectedUngrouped.delete(fn);
    renderUngroupedGrid();
    updateUngroupedActionButtons();
  }

  function removeLastTag(){
    if(activeTags.length === 0) return;
    activeTags.pop();
    renderChips();
    buildTagSuggestions();
    renderResults();
  }

  function isTypingTarget(el){
    if(!el) return false;
    const tag = el.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
  }

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight' && currentMode() === 'viewer'){ nextImage(); return; }
    if(e.key === 'ArrowLeft' && currentMode() === 'viewer'){ prevImage(); return; }
    if(e.key !== 'Escape') return;
    if(isTypingTarget(document.activeElement)) return;

    const mode = currentMode();

    if(mode === 'settings'){
      closeSettingsDialog();
      return;
    }

    if(mode === 'add-image-panel'){
      addImagePanel.style.display = 'none';
      return;
    }

    if(mode === 'viewer'){
      closeViewer();
      return;
    }

    if(mode === 'ungrouped'){
      if(selectedUngrouped.size > 0){
        unselectMostRecentImage();
      } else {
        setUngroupedView(false);
      }
      return;
    }

    // mode === 'main'
    if(activeTags.length > 0){
      removeLastTag();
    }
  });

  let touchStartX = null;
  viewer.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
  viewer.addEventListener('touchend', e => {
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 50){ dx > 0 ? prevImage() : nextImage(); }
    touchStartX = null;
  });

  loadSettings();
  applySettings();
  setNotesMode('preview');
  loadArchive();
  fetchAllImages();
})();
</script>
</body>
</html>
